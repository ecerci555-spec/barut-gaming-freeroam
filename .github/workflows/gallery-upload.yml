name: Barut Gaming - Galeri Fotograflarini Yukle
on:
  push:
    branches: [main]
    paths:
      - "barut-gallery.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack verified gallery pictures
        run: python scripts/install_gallery.py
      - name: Add photos and remove staging ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery
          git rm -f barut-gallery.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish 10 Barut Gaming in-game gallery images"
            git push
          fi
