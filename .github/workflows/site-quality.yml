name: Barut Gaming - Website Quality
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "gizlilik.html"
      - "kullanim-kosullari.html"
      - "assets/css/**"
      - "assets/js/**"
      - "config.js"
      - "sitemap.xml"
      - "scripts/validate_site.py"
      - ".github/workflows/site-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify local website files and anchors
        run: python3 scripts/validate_site.py
      - name: Verify active browser JavaScript syntax
        run: |
          node --check config.js
          node --check assets/js/app.js
          node --check assets/js/auth.js
          node --check assets/js/gallery.js
          node --check assets/js/weekly-videos.js
          node --check assets/js/pro-v6.js
